<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أغنية الذكريات - التوقيت المضبوط الكامل</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030308; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .content {
            position: relative; z-index: 10; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; width: 100%; max-width: 1000px;
        }

        .lyrics-box {
            min-height: 140px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            z-index: 5;
        }

        .lyrics {
            font-size: 2.6rem; 
            color: #ffffff; 
            font-weight: bold;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 10px rgba(0, 0, 0, 0.9);
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            letter-spacing: 1.5px;
        }

        .lyrics.show {
            opacity: 1; transform: translateY(0);
        }
    </style>
</head>
<body>

    <canvas id="nightCanvas"></canvas>

    <div class="content">
        <div class="lyrics-box">
            <div id="lyricsText" class="lyrics"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('nightCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // الأغنية كاملة من البداية للنهاية، مع تقديم وتظبيط توقيت الكوبليه من أول "لسه عنك" لتجنب أي تأخير
        const timedLines = [
            { text: "مع انك سيبت قلبي لليالي...", start: 0.0, end: 2.6 },
            { text: "وبرضه لسه مش داري بحالي...", start: 2.8, end: 5.4 },
            { text: "لسه عنك أنا بكتب أغاني...", start: 5.6, end: 8.2 },
            { text: "تحكي عن عيونك من تاني...", start: 8.4, end: 11.0 },
            { text: "اعذر يا حبيبي انشغالي...", start: 11.2, end: 14.4 },
            { text: "لو في مره حسيت إني مش بلاقيك...", start: 14.6, end: 18.2 },
            { text: "أنا حاسس بيك...", start: 18.4, end: 22.0 }
        ];

        const lyricsElement = document.getElementById('lyricsText');
        let startTime = Date.now();

        function checkLyricsTime() {
            let currentTime = (Date.now() - startTime) / 1000;

            if (currentTime > 23) {
                startTime = Date.now();
                currentTime = 0;
            }

            let activeLine = timedLines.find(item => currentTime >= item.start && currentTime <= item.end);

            if (activeLine) {
                if (lyricsElement.textContent !== activeLine.text) {
                    lyricsElement.textContent = activeLine.text;
                    lyricsElement.classList.add('show');
                }
            } else {
                lyricsElement.classList.remove('show');
            }
        }

        setInterval(checkLyricsTime, 40);

        // إعداد نقاط القلب ثلاثي الأبعاد 3D
        const heartPoints = [];
        const numPoints = 400;
        const scaleFactor = 16;

        for (let i = 0; i < numPoints; i++) {
            let t = (i / numPoints) * Math.PI * 2;
            let hx = 16 * Math.pow(Math.sin(t), 3);
            let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            
            heartPoints.push({
                x: hx * scaleFactor,
                y: hy * scaleFactor,
                z: (Math.random() - 0.5) * 40,
                size: Math.random() * 2 + 1.2,
                alpha: Math.random() * 0.5 + 0.5
            });
        }

        let heartAngleY = 0;

        class Particle {
            constructor(isHeartParticle = false, index = 0) {
                this.isHeart = isHeartParticle;
                if (this.isHeart) {
                    this.index = index;
                } else {
                    this.reset();
                }
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.type = Math.random() > 0.35 ? 'rain' : 'vortex';
                
                if (this.type === 'rain') {
                    this.y = Math.random() * -canvas.height;
                    this.speedY = Math.random() * 4 + 3.5;
                    this.length = Math.random() * 15 + 10;
                } else {
                    this.angle = Math.random() * Math.PI * 2;
                    this.radius = Math.random() * 80 + 10;
                    this.y = canvas.height + 20;
                    this.speedY = Math.random() * -2.5 - 1;
                    this.rotSpeed = (Math.random() - 0.5) * 0.05;
                    this.size = Math.random() * 2.5 + 1;
                    this.alpha = Math.random() * 0.8 + 0.2;
                    this.color = Math.random() > 0.4 ? '#b0002a' : '#ff3355';
                }
            }

            update() {
                if (!this.isHeart) {
                    if (this.type === 'rain') {
                        this.y += this.speedY;
                        if (this.y > canvas.height) {
                            this.reset();
                            this.y = -20;
                        }
                    } else {
                        this.y += this.speedY;
                        this.angle += this.rotSpeed;
                        this.alpha -= 0.003;
                        if (this.y < canvas.height / 2 || this.alpha <= 0) {
                            this.reset();
                        }
                    }
                }
            }

            draw() {
                ctx.save();
                let cx = canvas.width / 2;
                let cy = canvas.height / 2;

                if (this.isHeart) {
                    let p = heartPoints[this.index];
                    let rad = heartAngleY;
                    let cos = Math.cos(rad);
                    let sin = Math.sin(rad);
                    
                    let x3d = p.x * cos - p.z * sin;
                    let z3d = p.z * cos + p.x * sin;
                    
                    let perspective = 300 / (300 + z3d);
                    let currentX = cx + x3d * perspective;
                    let currentY = cy + p.y * perspective;

                    let depthAlpha = p.alpha * (z3d > 0 ? 1 : 0.5);

                    ctx.globalAlpha = depthAlpha;
                    ctx.fillStyle = '#b3002d'; // أحمر داكن عميق وساحر
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ff1a40';
                    ctx.beginPath();
                    ctx.arc(currentX, currentY, p.size * perspective, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    if (this.type === 'rain') {
                        ctx.strokeStyle = 'rgba(180, 210, 255, 0.25)';
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y);
                        ctx.lineTo(this.x - 0.5, this.y + this.length);
                        ctx.stroke();
                    } else {
                        let vx = cx + Math.cos(this.angle) * this.radius;
                        let vy = this.y;

                        ctx.globalAlpha = Math.max(this.alpha, 0);
                        ctx.fillStyle = this.color;
                        ctx.shadowBlur = 12;
                        ctx.shadowColor = this.color;
                        ctx.beginPath();
                        ctx.arc(vx, vy, this.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.restore();
            }
        }

        let particles = [];
        for (let i = 0; i < heartPoints.length; i++) {
            particles.push(new Particle(true, i));
        }
        for (let i = 0; i < 350; i++) {
            particles.push(new Particle(false));
        }

        function animate() {
            ctx.fillStyle = 'rgba(3, 3, 8, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            heartAngleY += 0.015;

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
